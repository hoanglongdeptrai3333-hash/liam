<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gửi Cô Thảo - Ngày Nhà Giáo Việt Nam 20/11</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@500;700&display=swap');

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Quicksand', sans-serif;
        background-color: #0b0314; /* Nền tối vũ trụ */
        color: #fff;
        min-height: 100vh;
        overflow: hidden;
        position: relative;
    }

    /* ==========================================
       1. MÀN HÌNH INTRO (MỞ ĐẦU)
       ========================================== */
    #intro-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a0b2e 0%, #05010a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        transition: opacity 1s ease;
    }

    .envelope {
        position: relative;
        width: 280px;
        height: 180px;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        border-radius: 10px;
        box-shadow: 0 20px 50px rgba(255, 100, 100, 0.3);
        cursor: pointer;
        animation: floatEnv 3s ease-in-out infinite;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Nắp phong bì */
    .envelope::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(135deg, #ff6b6b 0%, #ff9a9e 100%);
        clip-path: polygon(0 0, 50% 50%, 100% 0);
        z-index: 2;
        transition: transform 0.8s ease;
        transform-origin: top;
    }

    .envelope:hover {
        transform: scale(1.05) translateY(-10px);
        box-shadow: 0 30px 60px rgba(255, 100, 100, 0.5);
    }

    .envelope:hover::before {
        transform: rotateX(180deg);
    }

    /* Con dấu sáp */
    .wax-seal {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 50px; height: 50px;
        background: #b8001f;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.5rem;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        z-index: 3;
        transition: all 0.3s;
    }

    .envelope:hover .wax-seal {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    .intro-text {
        margin-top: 40px;
        font-size: 1.2rem;
        color: #ff9a9e;
        text-align: center;
        animation: pulseText 2s infinite;
        letter-spacing: 1px;
    }

    @keyframes floatEnv {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-15px); }
    }

    @keyframes pulseText {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; text-shadow: 0 0 10px #ff9a9e; }
    }

    /* ==========================================
       2. KHUNG CẢNH VŨ TRỤ (SAU KHI MỞ THIỆP)
       ========================================== */
    #universe-screen {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at center, #1a0b2e 0%, #05010a 100%);
        opacity: 0;
        visibility: hidden;
        transition: opacity 2s ease;
        z-index: 500;
        overflow: hidden;
    }

    #universe-screen.active {
        opacity: 1;
        visibility: visible;
    }

    /* Hiệu ứng tinh vân (Nebula) */
    .nebula {
        position: absolute;
        width: 600px; height: 600px;
        background: radial-gradient(circle, rgba(184,0,31,0.15) 0%, rgba(0,0,0,0) 70%);
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        animation: rotateNebula 20s linear infinite;
    }
    .nebula-2 {
        width: 400px; height: 400px;
        background: radial-gradient(circle, rgba(100,0,255,0.1) 0%, rgba(0,0,0,0) 70%);
        top: 30%; left: 30%;
        animation: rotateNebula 15s linear infinite reverse;
    }

    @keyframes rotateNebula {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Nội dung chính giữa vũ trụ */
    .universe-content {
        position: absolute;
        top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        z-index: 10;
        width: 90%;
        max-width: 600px;
    }

    .universe-title {
        font-family: 'Dancing Script', cursive;
        font-size: 3.5rem;
        color: #fff;
        margin-bottom: 10px;
        text-shadow: 0 0 20px #ff6b6b, 0 0 40px #b8001f;
        animation: fadeInScale 2s ease forwards;
        opacity: 0;
        transform: scale(0.8);
    }

    .universe-subtitle {
        font-size: 1.2rem;
        color: #ff9a9e;
        letter-spacing: 2px;
        margin-bottom: 30px;
        animation: fadeInScale 2s ease 0.5s forwards;
        opacity: 0;
        transform: scale(0.8);
    }

    /* Các lời chúc rơi xuống */
    .message-container {
        position: relative;
        height: 150px;
        width: 100%;
        margin-top: 20px;
    }

    .floating-message {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        font-size: 1.2rem;
        line-height: 1.6;
        color: #fff;
        font-style: italic;
        text-shadow: 0 0 10px rgba(255, 107, 107, 0.8);
        opacity: 0;
        animation: dropMessage 4s ease-in-out forwards;
    }

    @keyframes dropMessage {
        0% { opacity: 0; top: -50px; transform: translateX(-50%) scale(0.8); }
        20% { opacity: 1; top: 20px; transform: translateX(-50%) scale(1); }
        80% { opacity: 1; top: 20px; transform: translateX(-50%) scale(1); }
        100% { opacity: 0; top: 80px; transform: translateX(-50%) scale(0.9); }
    }

    @keyframes fadeInScale {
        to { opacity: 1; transform: scale(1); }
    }

    /* ==========================================
       3. HIỆU ỨNG SAO BĂNG, TRÁI TIM, NGÔI SAO
       ========================================== */
    .star-particle {
        position: absolute;
        border-radius: 50%;
        background: #fff;
        animation: twinkle infinite alternate;
        box-shadow: 0 0 10px #fff, 0 0 20px #ff9a9e;
    }

    @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.5); }
        100% { opacity: 1; transform: scale(1.2); }
    }

    /* Trái tim bay lơ lửng */
    .heart-particle {
        position: absolute;
        font-size: 1.5rem;
        color: #ff2d55;
        text-shadow: 0 0 15px #ff2d55, 0 0 30px #b8001f;
        animation: floatHeart linear infinite;
        opacity: 0.7;
    }

    @keyframes floatHeart {
        0% { transform: translateY(100vh) scale(0) rotate(0deg); opacity: 0; }
        20% { opacity: 0.8; }
        80% { opacity: 0.8; }
        100% { transform: translateY(-100px) scale(1.5) rotate(360deg); opacity: 0; }
    }

    /* Sao băng */
    .shooting-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 10px 2px #fff, 0 0 20px 4px #ff9a9e;
        opacity: 0;
    }

    .shooting-star::after {
        content: '';
        position: absolute;
        top: 50%; left: 0;
        width: 100px; height: 2px;
        background: linear-gradient(90deg, #fff, transparent);
        transform: translateY(-50%);
    }

    .shooting-star.active {
        animation: shoot 2s linear forwards;
    }

    @keyframes shoot {
        0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
        100% { transform: translate(-300px, 300px) rotate(-45deg); opacity: 0; }
    }

    /* Nút chơi lại / Tương tác thêm */
    .btn {
        display: inline-block;
        margin-top: 30px;
        padding: 12px 30px;
        font-size: 1rem;
        font-weight: bold;
        font-family: 'Quicksand', sans-serif;
        color: #fff;
        background: transparent;
        border: 2px solid #ff6b6b;
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: 0 0 15px rgba(255, 107, 107, 0.3);
        opacity: 0;
        animation: fadeInScale 2s ease 2s forwards;
    }

    .btn:hover {
        background: #ff6b6b;
        color: #0b0314;
        box-shadow: 0 0 30px rgba(255, 107, 107, 0.8);
        transform: scale(1.05);
    }
</style>
</head>
<body>

<!-- MÀN HÌNH 1: PHONG BÌ KÍNH MỜI -->
<div id="intro-screen">
    <div class="envelope" onclick="openEnvelope()">
        <div class="wax-seal">❤️</div>
    </div>
    <div class="intro-text">Chạm vào phong bì để mở thiệp...</div>
</div>

<!-- MÀN HÌNH 2: VŨ TRỤ VÀ LỜI CHÚC -->
<div id="universe-screen">
    <div class="nebula"></div>
    <div class="nebula nebula-2"></div>
    
    <div class="universe-content">
        <h1 class="universe-title">Gửi Cô Thảo</h1>
        <p class="universe-subtitle">Người mẹ hiền thứ hai của chúng em</p>
        
        <div class="message-container" id="messageContainer">
            <!-- Các lời chúc sẽ được chèn bằng JS -->
        </div>

        <button class="btn" onclick="replayUniverse()">🌟 Xem Lại Từ Đầu</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. XỬ LÝ CHUYỂN CẢNH
    // ==========================================
    const introScreen = document.getElementById('intro-screen');
    const universeScreen = document.getElementById('universe-screen');

    function openEnvelope() {
        // Hiệu ứng mờ dần màn hình intro
        introScreen.style.opacity = '0';
        
        // Sau 1s, ẩn hẳn intro và hiện vũ trụ
        setTimeout(() => {
            introScreen.style.display = 'none';
            universeScreen.classList.add('active');
            
            // Bắt đầu bắn pháo hoa sao, trái tim
            initUniverseEffects();
            // Bắt đầu hiện lời chúc
            startWishes();
        }, 1000);
    }

    // ==========================================
    // 2. HIỆU ỨNG VŨ TRỤ (SAO, TRÁI TIM, SAO BĂNG)
    // ==========================================
    function initUniverseEffects() {
        // Tạo các ngôi sao lấp lánh nhỏ
        for (let i = 0; i < 80; i++) {
            createStar();
        }
        
        // Tạo trái tim bay lên liên tục
        setInterval(createHeart, 800);
        
        // Tạo sao băng thỉnh thoảng
        setInterval(createShootingStar, 2000);
        
        // Tạo thêm sao lấp lánh liên tục
        setInterval(createStar, 300);
    }

    function createStar() {
        const star = document.createElement('div');
        star.className = 'star-particle';
        const size = Math.random() * 3 + 1;
        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + 'vw';
        star.style.top = Math.random() * 100 + 'vh';
        star.style.animationDuration = (Math.random() * 2 + 1) + 's';
        star.style.animationDelay = (Math.random() * 2) + 's';
        
        universeScreen.appendChild(star);
        
        // Tự động xóa sau khi hết hiệu ứng để tránh lag
        setTimeout(() => star.remove(), 4000);
    }

    function createHeart() {
        const heart = document.createElement('div');
        heart.className = 'heart-particle';
        heart.innerHTML = '❤️';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
        heart.style.animationDuration = (Math.random() * 5 + 5) + 's';
        
        universeScreen.appendChild(heart);
        
        setTimeout(() => heart.remove(), 10000);
    }

    function createShootingStar() {
        const star = document.createElement('div');
        star.className = 'shooting-star';
        // Xuất phát từ nửa trên màn hình, bên phải
        star.style.left = (Math.random() * 50 + 50) + 'vw';
        star.style.top = (Math.random() * 30) + 'vh';
        
        universeScreen.appendChild(star);
        
        // Kích hoạt animation
        setTimeout(() => {
            star.classList.add('active');
        }, 100);

        // Xóa sau khi xong
        setTimeout(() => star.remove(), 3000);
    }

    // ==========================================
    // 3. HIỆU ỨNG LỜI CHÚC RƠI XUỐNG TỪ TỪ
    // ==========================================
    const wishes = [
        "Cô Thảo kính mến! 🌸",
        "Nhân ngày 20/11, chúng em muốn gửi đến cô một món quà nhỏ.",
        "Cảm ơn cô vì đã luôn kiên nhẫn, dịu dàng và thấu hiểu chúng em.",
        "Cô không chỉ dạy chữ, mà còn dạy chúng em cách yêu thương và trưởng thành.",
        "Những lời dạy của cô như những vì sao sáng trên bầu trời tri thức.",
        "Chúc cô luôn mạnh khỏe, bình an, và mãi là người mẹ hiền của bao thế hệ học trò. ❤️",
        "Chúng em yêu cô rất nhiều! Happy 20/11! ✨"
    ];

    let wishIndex = 0;

    function startWishes() {
        wishIndex = 0;
        showNextWish();
    }

    function showNextWish() {
        if (wishIndex >= wishes.length) return; // Hết lời chúc thì dừng

        const container = document.getElementById('messageContainer');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'floating-message';
        msgDiv.innerText = wishes[wishIndex];
        
        container.appendChild(msgDiv);

        // Xóa tin nhắn cũ sau 4s để không bị chồng chất
        setTimeout(() => {
            if(msgDiv.parentNode) msgDiv.remove();
        }, 4500);

        wishIndex++;
        
        // Gọi lại hàm sau 3.5 giây để hiện lời chúc tiếp theo
        if (wishIndex < wishes.length) {
            setTimeout(showNextWish, 3500);
        }
    }

    // ==========================================
    // 4. CHƠI LẠI (RESET)
    // ==========================================
    function replayUniverse() {
        // Xóa tất cả lời chúc đang hiện
        document.getElementById('messageContainer').innerHTML = '';
        
        // Bắt đầu lại chuỗi lời chúc
        setTimeout(startWishes, 500);
    }
</script>

</body>
</html>
