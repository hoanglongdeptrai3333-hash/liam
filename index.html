<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tài Xỉu & Tên Lửa</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-info {
            font-size: 14px;
            color: #888;
        }
        .balance {
            font-size: 24px;
            color: #00ff88;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,255,136,0.5);
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: #222;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #333;
        }
        .tab.active {
            background: #333;
            border-color: #ffcc00;
            color: #ffcc00;
        }
        
        /* Các nút cược */
        .bet-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .bet-btn {
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        .btn-tai { background: #ff4d4d; color: white; }
        .btn-xiu { background: #4da6ff; color: white; }
        .bet-btn:active { transform: scale(0.95); }

        /* Modal Nạp Thẻ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: #1e1e1e;
            width: 90%;
            max-width: 350px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #ffcc00;
        }
        .modal h3 { text-align: center; color: #ffcc00; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2a2a2a;
            color: white;
            box-sizing: border-box;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #ffcc00;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-close {
            background: transparent;
            border: 1px solid #888;
            color: #888;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        /* Game Tên Lửa */
        .rocket-area {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .multiplier {
            font-size: 48px;
            font-weight: bold;
            color: #00ff88;
            margin: 20px 0;
        }
        .rocket-status {
            color: #ffcc00;
            font-size: 18px;
        }
        
        /* Admin Panel */
        .admin-panel {
            margin-top: 20px;
            padding: 10px;
            border: 1px dashed #444;
            font-size: 12px;
            display: none;
        }
        .admin-panel input { width: 60px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Phần Header -->
    <div class="header">
        <div>
            <div class="user-info">Chào, <span id="username">liam</span> (ADMIN)</div>
            <div class="balance" id="balanceDisplay">2.000.200.000 đ</div>
        </div>
        <button onclick="openNapThe()" style="background:#ffcc00; border:none; padding:8px; border-radius:5px; cursor:pointer;">Nạp Thẻ</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" onclick="switchTab('taixiu')">Tài Xỉu</div>
        <div class="tab" onclick="switchTab('rocket')">Tên Lửa</div>
    </div>

    <!-- Giao diện Tài Xỉu -->
    <div id="gameTaixiu">
        <div class="bet-buttons">
            <button class="bet-btn btn-tai" onclick="playTaiXiu('tai')">TÀI (50/50)</button>
            <button class="bet-btn btn-xiu" onclick="playTaiXiu('xiu')">XỈU (50/50)</button>
        </div>
    </div>

    <!-- Giao diện Tên Lửa -->
    <div id="gameRocket" class="rocket-area">
        <div class="rocket-status" id="rocketStatus">Sẵn sàng bay...</div>
        <div class="multiplier" id="multiplierDisplay">x1.00</div>
        <button class="bet-btn" style="background: #00ff88; color: black; width: 100%; margin-bottom:10px;" onclick="startRocket()">BẮT ĐẦU BAY (Cược 10k)</button>
        <button class="bet-btn" style="background: #ffcc00; color: black; width: 100%;" onclick="cashOutRocket()">RÚT TIỀN</button>
        <p style="font-size:12px; color:#888; margin-top:10px;">*Tỉ lệ nổ ngẫu nhiên 50/50, nhưng không bao giờ nổ ở x2, x3, x4.</p>
    </div>

    <!-- Admin Panel (Chỉ hiện khi là Admin) -->
    <div class="admin-panel" id="adminPanel">
        <strong>ADMIN PANEL (Chỉnh sửa User)</strong><br><br>
        <label>Nhập số tiền mới:</label><br>
        <input type="number" id="adminMoneyInput" placeholder="VD: 500000">
        <button onclick="adminSetMoney()" style="background:#ff4d4d; color:white; border:none; padding:5px; cursor:pointer;">Cập nhật</button>
    </div>
</div>

<!-- Modal Nạp Thẻ -->
<div class="modal-overlay" id="napTheModal">
    <div class="modal">
        <h3>NẠP THẺ CÀO</h3>
        <div class="form-group">
            <label>Mệnh giá (Tối đa 500k)</label>
            <select id="cardValue">
                <option value="10000">10.000 đ</option>
                <option value="20000">20.000 đ</option>
                <option value="50000">50.000 đ</option>
                <option value="100000">100.000 đ</option>
                <option value="200000">200.000 đ</option>
                <option value="500000">500.000 đ</option>
            </select>
        </div>
        <div class="form-group">
            <label>Mã Thẻ (8 số)</label>
            <input type="text" id="cardCode" placeholder="Nhập 8 số..." maxlength="8">
        </div>
        <div class="form-group">
            <label>Seri (Trên 10 số)</label>
            <input type="text" id="cardSeri" placeholder="Nhập seri..." minlength="11">
        </div>
        <button class="btn-submit" onclick="submitNapThe()">Gửi Yêu Cầu</button>
        <button class="btn-close" onclick="closeNapThe()">Đóng</button>
    </div>
</div>

<script>
    // --- BIẾN TOÀN CỤC ---
    let currentMoney = 2000200000; // Số dư ban đầu
    let isAdmin = true; // Giả lập đăng nhập admin
    
    // Trạng thái Game Tên Lửa
    let rocketInterval;
    let currentMultiplier = 1.00;
    let isRocketRunning = false;
    let betAmount = 10000;
    let isCashedOut = false;

    // --- KHỞI TẠO ---
    document.addEventListener("DOMContentLoaded", () => {
        updateBalance();
        if(isAdmin) {
            document.getElementById("adminPanel").style.display = "block";
        }
    });

    function updateBalance() {
        document.getElementById("balanceDisplay").innerText = currentMoney.toLocaleString('vi-VN') + " đ";
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if(tabName === 'taixiu') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('gameTaixiu').style.display = 'block';
            document.getElementById('gameRocket').style.display = 'none';
        } else {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('gameTaixiu').style.display = 'none';
            document.getElementById('gameRocket').style.display = 'block';
        }
    }

    // --- CHỨC NĂNG NẠP THẺ ---
    function openNapThe() {
        document.getElementById('napTheModal').style.display = 'flex';
    }

    function closeNapThe() {
        document.getElementById('napTheModal').style.display = 'none';
    }

    function submitNapThe() {
        let code = document.getElementById('cardCode').value;
        let seri = document.getElementById('cardSeri').value;
        let value = parseInt(document.getElementById('cardValue').value);

        // Kiểm tra điều kiện
        if (code.length !== 8) {
            alert("Mã thẻ phải đúng 8 số!");
            return;
        }
        if (seri.length <= 10) {
            alert("Seri thẻ phải trên 10 số!");
            return;
        }
        if (value > 500000) {
            alert("Mệnh giá tối đa là 500k!");
            return;
        }

        alert("Đã gửi yêu cầu! Vui lòng đợi 2-3 phút để duyệt tiền.");
        closeNapThe();

        // Giả lập chờ 2-3 phút (Ở đây set 3 giây để test)
        // Trong thực tế sẽ có một interval kiểm tra API server
        setTimeout(() => {
            currentMoney += value;
            updateBalance();
            alert(`Nạp thành công ${value.toLocaleString('vi-VN')} đ!`);
        }, 3000); 
    }

    // --- CHỨC NĂNG ADMIN ---
    function adminSetMoney() {
        if (!isAdmin) return;
        let newMoney = document.getElementById('adminMoneyInput').value;
        if (newMoney) {
            currentMoney = parseInt(newMoney);
            updateBalance();
            alert("Đã cập nhật số dư người chơi!");
        }
    }

    // --- CHỨC NĂNG GAME TÀI XỈU (Mô phỏng) ---
    function playTaiXiu(choice) {
        if (currentMoney < 10000) {
            alert("Bạn không đủ tiền cược!");
            return;
        }
        currentMoney -= 10000;
        updateBalance();

        // Random 50/50
        let result = Math.random() < 0.5 ? 'tai' : 'xiu';
        // Giả lập xúc xắc
        let dice1 = Math.floor(Math.random() * 6) + 1;
        let dice2 = Math.floor(Math.random() * 6) + 1;
        let dice3 = Math.floor(Math.random() * 6) + 1;
        let total = dice1 + dice2 + dice3;
        let actualResult = total >= 11 ? 'tai' : 'xiu';

        setTimeout(() => {
            if (choice === actualResult) {
                currentMoney += 20000; // Thắng x2
                updateBalance();
                alert(`Kết quả: ${dice1} + ${dice2} + ${dice3} = ${total} (${actualResult.toUpperCase()}). Bạn THẮNG!`);
            } else {
                alert(`Kết quả: ${dice1} + ${dice2} + ${dice3} = ${total} (${actualResult.toUpperCase()}). Bạn THUA!`);
            }
        }, 500);
    }

    // --- CHỨC NĂNG GAME TÊN LỬA (Yêu cầu đặc biệt) ---
    function startRocket() {
        if (isRocketRunning) return;
        if (currentMoney < betAmount) {
            alert("Bạn không đủ tiền cược!");
            return;
        }

        currentMoney -= betAmount;
        updateBalance();
        
        isRocketRunning = true;
        isCashedOut = false;
        currentMultiplier = 1.00;
        document.getElementById('rocketStatus').innerText = "Đang bay...";
        document.getElementById('multiplierDisplay').style.color = "#00ff88";

        // Logic Nổ: 
        // Yêu cầu: 50/50 thắng thua, nhưng KHÔNG BAO GIỜ nổ ở x2, x3, x4. 
        // => Nếu nổ thì phải nổ từ x5 trở lên. Nếu không nổ thì bay mãi (hoặc đến x10 thì dừng).
        
        // Tạo ngẫu nhiên điểm nổ (Crash Point)
        // 50% cơ hội nổ (từ x5 đến x10), 50% cơ hội không nổ (bay đến x10)
        let isCrash = Math.random() < 0.5; 
        let crashPoint = 999; // Mặc định không nổ (bay đến x10)

        if (isCrash) {
            // Nếu nổ, chọn ngẫu nhiên từ x5.0 đến x10.0
            // Công thức: 5 + random(0 đến 5)
            crashPoint = 5.0 + (Math.random() * 5.0); 
        } else {
            // Không nổ, cho bay đến x10 (sau đó tự động dừng để rút)
            crashPoint = 10.0; 
        }

        // Bắt đầu đếm
        rocketInterval = setInterval(() => {
            currentMultiplier += 0.01;
            
            // Cập nhật hiển thị
            document.getElementById('multiplierDisplay').innerText = "x" + currentMultiplier.toFixed(2);

            // Kiểm tra điều kiện nổ
            // Nếu vượt qua crashPoint (và crashPoint >= 5) thì nổ
            if (currentMultiplier >= crashPoint) {
                clearInterval(rocketInterval);
                isRocketRunning = false;
                document.getElementById('rocketStatus').innerText = "ĐÃ NỔ! Bạn mất tiền cược.";
                document.getElementById('multiplierDisplay').style.color = "red";
                alert(`Tên lửa nổ tại x${currentMultiplier.toFixed(2)}! Bạn thua.`);
                return;
            }

            // Nếu đạt x10 thì dừng (giới hạn max)
            if (currentMultiplier >= 10.0) {
                clearInterval(rocketInterval);
                isRocketRunning = false;
                document.getElementById('rocketStatus').innerText = "Đã đạt giới hạn x10. Hãy rút tiền!";
            }

        }, 100); // Tốc độ bay
    }

    function cashOutRocket() {
        if (!isRocketRunning) {
            alert("Chưa có phiên bay nào!");
            return;
        }
        if (isCashedOut) {
            alert("Bạn đã rút rồi!");
            return;
        }
        
        // Nếu đang bay mà bấm rút
        isCashedOut = true;
        isRocketRunning = false;
        clearInterval(rocketInterval);

        // Tiền thắng = Tiền cược * Hệ số hiện tại
        let winAmount = Math.floor(betAmount * currentMultiplier);
        currentMoney += winAmount;
        updateBalance();

        document.getElementById('rocketStatus').innerText = `Đã rút thành công tại x${currentMultiplier.toFixed(2)}!`;
        document.getElementById('multiplierDisplay').style.color = "#ffcc00";
        alert(`Bạn đã rút thành công ${winAmount.toLocaleString('vi-VN')} đ!`);
    }

</script>

</body>
</html>
