<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Super Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#12121e;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:10px}.box{background:#1e1e2f;padding:15px;border-radius:15px;width:100%;max-width:400px;border:1px solid #333;text-align:center}h2{color:#e94560;margin-bottom:15px;text-transform:uppercase;font-size:20px}input{width:100%;padding:10px;margin-bottom:10px;border-radius:5px;border:1px solid #444;background:#000;color:#fff;outline:none}button{width:100%;padding:12px;margin-bottom:10px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;color:#fff;transition:0.2s}button:active{transform:scale(0.95)}button:disabled{opacity:0.5;cursor:not-allowed}.tabs{display:flex;gap:5px;margin-bottom:15px}.tabs button{background:#333;margin:0;padding:8px;font-size:12px;flex:1}.tabs button.active{background:#e94560}.btn-red{background:#d63031}.btn-green{background:#00b894}.btn-blue{background:#2980b9}.btn-yellow{background:#f39c12;color:#000}.btn-gray{background:#555}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;text-align:left;background:#000;padding:10px;border-radius:8px}.bal{color:#00ff88;font-weight:bold;font-size:18px}.debt{color:#ff4757;font-size:12px;display:none}.menu-btn{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;width:auto;padding:0 10px;margin:0}.tx-timer{font-size:18px;font-weight:bold;color:#ffd369;margin-bottom:10px}.dice-box{display:flex;justify-content:center;gap:10px;margin:15px 0}.dice{width:60px;height:60px;background:#fff;color:#000;font-size:40px;font-weight:bold;display:flex;justify-content:center;align-items:center;border-radius:10px}.crash-box{height:120px;background:#050510;position:relative;overflow:hidden;border-radius:10px;margin-bottom:10px;border:1px solid #444}.mult{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:bold;color:#00ff88;z-index:2}.rocket{position:absolute;bottom:10px;left:10px;font-size:25px;z-index:1}.rab-box{height:90px;background:#4ecdc4;position:relative;overflow:hidden;border-radius:10px;margin-bottom:10px;border:2px solid #2c3e50}.ground{position:absolute;bottom:0;width:100%;height:20px;background:#2ecc71;border-top:2px solid #27ae60;z-index:1}.rab{position:absolute;bottom:20px;left:70%;font-size:28px;transform:scaleX(-1);z-index:3}.fox{position:absolute;bottom:20px;left:30%;font-size:30px;transform:scaleX(-1);z-index:2}.r-mult{position:absolute;top:5px;right:10px;font-weight:bold;font-size:14px;color:#fff;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:5px;z-index:4}.goal-box{height:150px;background:#27ae60;position:relative;overflow:hidden;border-radius:10px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:space-between;padding:10px;border:3px solid #fff}.g-row{display:flex;justify-content:space-between;height:45%}.g-spot{width:30%;height:100%;background:rgba(255,255,255,0.2);border:2px dashed #fff;display:flex;justify-content:center;align-items:center;font-size:25px;border-radius:5px;cursor:pointer}.gk{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:35px;z-index:10;transition:all 0.3s}.hidden{display:none!important}#toast{position:fixed;top:-100px;left:50%;transform:translateX(-50%);background:#d63031;color:#fff;padding:10px;border-radius:8px;font-weight:bold;transition:top 0.5s;z-index:1000;text-align:center;width:90%;max-width:350px;border:2px solid #fff}#toast.show{top:20px}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:center;align-items:center;z-index:100}.modal-c{background:#1e1e2f;padding:15px;border-radius:10px;width:95%;max-width:400px;border:1px solid #8e44ad;max-height:85vh;overflow-y:auto;text-align:left}.adm-tbl{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:12px}.adm-tbl th,.adm-tbl td{border-bottom:1px solid #333;padding:5px}.adm-inp{width:70px;padding:3px}
</style>
</head>
<body>
<div id="toast"><span id="toastTxt"></span></div>

<div class="box" id="loginScreen">
    <h2>ĐĂNG NHẬP</h2>
    <input type="text" id="usernameInput" placeholder="Nhập tên...">
    <input type="text" id="codeInput" placeholder="Mã Tân Thủ (200k)">
    <button class="btn-blue" onclick="dangNhap()">VÀO GAME</button>
</div>

<div class="box hidden" id="gameScreen">
    <div class="header">
        <div>
            <div id="displayName" style="font-weight:bold;color:#ffd369">User</div>
            <div class="bal" id="displayBalance">0 đ</div>
            <div class="debt" id="displayDebt">Nợ: 0 đ</div>
        </div>
        <div style="display:flex; align-items:center;">
            <button class="menu-btn" id="adminBtn" onclick="moAdmin()" style="display:none;">☰</button>
            <button class="btn-red" style="width:auto;padding:5px 10px;margin:0 0 0 5px;font-size:12px" onclick="dangXuat()">Thoát</button>
        </div>
    </div>

    <div class="tabs">
        <button class="active" id="tabBtn0" onclick="switchTab(0)">Tài Xỉu</button>
        <button id="tabBtn1" onclick="switchTab(1)">Tên Lửa</button>
        <button id="tabBtn2" onclick="switchTab(2)">Cáo Thỏ</button>
        <button id="tabBtn3" onclick="switchTab(3)">Bắt Gôn</button>
    </div>

    <div id="tab0">
        <div class="tx-timer" id="txTimer">...</div>
        <div class="dice-box"><div class="dice" id="d1">?</div><div class="dice" id="d2">?</div><div class="dice" id="d3">?</div></div>
        <div id="resTx" style="height:25px;font-weight:bold;margin-bottom:10px"></div>
        <input type="number" id="betTx" value="100000" min="1000">
        <button class="btn-red" id="btnXiu" onclick="cuocTx('xiu')">CƯỢC XỈU</button>
        <button class="btn-green" id="btnTai" onclick="cuocTx('tai')">CƯỢC TÀI</button>
    </div>

    <div id="tab1" class="hidden">
        <div class="crash-box"><div class="mult" id="multCrash">1.00x</div><div class="rocket" id="rocketObj">🚀</div></div>
        <input type="number" id="betCrash" value="100000" min="1000">
        <button class="btn-blue" id="btnStartCrash" onclick="startCrash()">BẮT ĐẦU BAY</button>
        <button class="btn-yellow" id="btnCashCrash" onclick="cashCrash()" disabled>CHỐT</button>
    </div>

    <div id="tab2" class="hidden">
        <div class="rab-box"><div class="ground"></div><div class="r-mult" id="multRab">1.00x</div><div class="fox" id="foxObj">🦊</div><div class="rab" id="rabObj">🐇</div></div>
        <input type="number" id="betRab" value="100000" min="1000">
        <button class="btn-green" id="btnStartRab" onclick="startRab()">THẢ THỎ</button>
        <button class="btn-yellow" id="btnCashRab" onclick="cashRab()" disabled>CHỐT</button>
    </div>

    <div id="tab3" class="hidden">
        <div class="goal-box" id="goalBox">
            <div class="g-row"><div class="g-spot" onclick="sutGon('TL')">↖️</div><div class="g-spot" onclick="sutGon('TR')">↗️</div></div>
            <div class="g-row" style="align-items: flex-end;"><div class="g-spot" onclick="sutGon('DL')">↙️</div><div class="g-spot" onclick="sutGon('DR')">↘️</div></div>
            <div class="gk" id="gkObj">🧤</div>
        </div>
        <div id="resGoal" style="height:25px;font-weight:bold;margin-bottom:10px;color:#ffd369"></div>
        <input type="number" id="betGoal" value="100000" min="1000">
        <p style="font-size:12px;color:#aaa;margin-bottom:10px">Chọn hướng sút</p>
    </div>

    <div id="loanControls" class="hidden"><button class="btn-yellow" onclick="vayTien()">VAY TIỀN (Max 10M)</button></div>
</div>

<div class="modal hidden" id="loanModal">
    <div class="modal-c" style="text-align:center;border-color:#f39c12">
        <h3 style="color:#f39c12">HẾT TIỀN!</h3><p style="font-size:14px;margin:10px 0">Vay 2.000.000 đ? Nợ quá 10M sẽ khóa.</p>
        <button class="btn-yellow" onclick="xacNhanVay()">VAY NGAY</button><button class="btn-gray" onclick="dongModal()">ĐÓNG</button>
    </div>
</div>

<div class="modal hidden" id="adminModal">
    <div class="modal-c">
        <h3 style="color:#9b59b6;text-align:center">QUẢN LÝ NGƯỜI DÙNG</h3>
        <table class="adm-tbl" id="adminTable"><thead><tr><th>Tên</th><th>Tiền</th><th>Sửa</th><th>Trạng thái</th></tr></thead><tbody></tbody></table>
        <button class="btn-gray" onclick="dongAdmin()">ĐÓNG</button>
    </div>
</div>

<script>
let data=JSON.parse(localStorage.getItem('gameData'))||{},maDaDung=[],ten="",soDu=0,soNo=0;
let txInt=null,txTime=15,txPhase='waiting',crTimer=null,cMul=1,cPoint=0,cCrashed=false,cBet=0,raTimer=null,rMul=1,rPoint=0,rCaught=false,rBet=0;
let goalCount = 0; // Đếm số lần sút gôn (tối đa 3)

const fmt=s=>s.toLocaleString('vi-VN')+' đ',show=id=>document.getElementById(id).classList.remove('hidden'),hide=id=>document.getElementById(id).classList.add('hidden'),saveData=()=>localStorage.setItem('gameData',JSON.stringify(data));
function showToast(msg){document.getElementById('toastTxt').innerText=msg;document.getElementById('toast').classList.add('show');setTimeout(()=>document.getElementById('toast').classList.remove('show'),4000)}

function switchTab(i){for(let j=0;j<4;j++){document.getElementById('tabBtn'+j).classList.remove('active');hide('tab'+j)}document.getElementById('tabBtn'+i).classList.add('active');show('tab'+i);if(i===0&&!txInt)startTxLoop()}

function capNhat(){
    document.getElementById('displayBalance').innerText=fmt(soDu);
    let dEl=document.getElementById('displayDebt');
    if(soNo>0){dEl.style.display='block';dEl.innerText='Nợ: '+fmt(soNo)}else dEl.style.display='none';
    if(data[ten]){data[ten].soDu=soDu;data[ten].soNo=soNo;saveData()}
    if(soNo>10000000){data[ten].isBanned=true;saveData();alert("TÀI KHOẢN BỊ KHÓA DO NỢ QUÁ 10 TRIỆU!");location.reload()}
    let h=soDu>0;document.getElementById('btnTai').disabled=!h||txPhase!=='betting';document.getElementById('btnXiu').disabled=!h||txPhase!=='betting';
    if(!h){document.getElementById('btnStartCrash').style.display='none';document.getElementById('btnStartRab').style.display='none';show('loanControls')}else{if(!crTimer)document.getElementById('btnStartCrash').style.display='block';if(!raTimer)document.getElementById('btnStartRab').style.display='block';hide('loanControls')}
}

function dangNhap(){
    let u=document.getElementById('usernameInput').value.trim().toLowerCase(),c=document.getElementById('codeInput').value.trim().toLowerCase();
    if(!u)return alert("Nhập tên!");
    
    if(data[u]) {
        if(data[u].isBanned) return alert("TÀI KHOẢN ĐÃ BỊ BAN BỞI ADMIN!");
    } else {
        let t=(u==='liam')?2000000000:2000000;
        data[u]={soDu:t,soNo:0,isBanned:false,isAdmin:(u==='liam')};
        saveData();
    }
    
    ten=u;
    document.getElementById('displayName').innerText=ten;
    soDu=data[ten].soDu;soNo=data[ten].soNo;
    
    if(c==="liam đz"&&!maDaDung.includes(ten)){soDu+=200000;maDaDung.push(ten);alert("Nhập mã thành công +200k!")}else if(c!==""&&c!=="liam đz")alert("Mã sai!");
    
    if(data[ten].isAdmin) document.getElementById('adminBtn').style.display='block'; else document.getElementById('adminBtn').style.display='none';
    
    goalCount = 0; // Reset số lần sút
    capNhat();hide('loginScreen');show('gameScreen');startTxLoop();
}

function dangXuat(){if(crTimer||raTimer)return alert("Đang trong ván!");if(confirm("Thoát?"))location.reload()}

function startTxLoop(){txTime=15;txPhase='betting';capNhat();if(txInt)clearInterval(txInt);txInt=setInterval(()=>{txTime--;let t=document.getElementById('txTimer');if(txTime>2){t.innerText=`Cược: ${txTime}s`;t.style.color='#ffd369'}else if(txTime>0){t.innerText=`Khóa: ${txTime}s`;t.style.color='#ff4757';txPhase='locked';capNhat()}else{txPhase='rolling';t.innerText='Lắc...';t.style.color='#00ff88';clearInterval(txInt);txInt=null;lacXucXac()}},1000)}

function cuocTx(lc){if(txPhase!=='betting')return;let c=parseInt(document.getElementById('betTx').value);if(isNaN(c)||c<1000||c>soDu)return alert("Tiền cược không hợp lệ!");soDu-=c;data[ten].pendingBet={type:lc,amount:c};capNhat()}

function lacXucXac(){let d1=document.getElementById('d1'),d2=document.getElementById('d2'),d3=document.getElementById('d3'),dem=0;let itv=setInterval(()=>{d1.innerText=Math.floor(Math.random()*6)+1;d2.innerText=Math.floor(Math.random()*6)+1;d3.innerText=Math.floor(Math.random()*6)+1;dem++;if(dem>15){clearInterval(itv);let x1=Math.floor(Math.random()*6)+1,x2=Math.floor(Math.random()*6)+1,x3=Math.floor(Math.random()*6)+1;d1.innerText=x1;d2.innerText=x2;d3.innerText=x3;let tong=x1+x2+x3,laTai=tong>=11&&tong<=17,laXiu=tong>=4&&tong<=10,laBao=x1===x2&&x2===x3;let rd=document.getElementById('resTx');rd.innerText=`Tổng: ${tong} - `+(laBao?"BÃO":(laTai?"TÀI":"XỈU"));rd.style.color=laTai?'#00ff88':(laXiu?'#ff4757':'#ffd369');let bet=data[ten].pendingBet;if(bet&&!laBao){if(bet.type==='tai'&&laTai||bet.type==='xiu'&&laXiu){soDu+=bet.amount*2;rd.innerText+=' - THẮNG!';if(bet.amount*2>=10000000)showToast(`🔥 ${ten} thắng Tài Xỉu +${fmt(bet.amount*2)}!`)}else rd.innerText+=' - THUA!'}else if(laBao&&bet){soDu+=bet.amount;rd.innerText+=' - HOÀN TIỀN!'}data[ten].pendingBet=null;capNhat();setTimeout(()=>{startTxLoop()},3000)}},50)}

// === TÊN LỬA MỐC CỐ ĐỊNH ===
function startCrash(){
    if(crTimer)return;cBet=parseInt(document.getElementById('betCrash').value);if(isNaN(cBet)||cBet<1000||cBet>soDu)return alert("Tiền cược không hợp lệ!");
    soDu-=cBet;capNhat();cMul=1;cCrashed=false;
    
    // Random chọn mốc nổ dựa trên tỉ lệ
    let r = Math.random();
    if (r < 0.40) cPoint = 2.0;        // 40%
    else if (r < 0.70) cPoint = 3.0;   // 30%
    else if (r < 0.85) cPoint = 4.0;   // 15%
    else if (r < 0.95) cPoint = 6.0;   // 10%
    else if (r < 0.98) cPoint = 46.0;  // 3%
    else if (r < 0.995) cPoint = 65.0; // 1.5%
    else cPoint = 96.0;                // 0.5% (Siêu hiếm)

    let m=document.getElementById('multCrash'),rk=document.getElementById('rocketObj');m.innerText="1.00x";m.style.color='#00ff88';rk.innerText="🚀";
    document.getElementById('btnStartCrash').style.display='none';document.getElementById('btnCashCrash').disabled=false;document.getElementById('betCrash').disabled=true;
    
    let st=Date.now();
    crTimer=setInterval(()=>{
        let tm=(Date.now()-st)/1000;
        // Tốc độ bay chậm lại ở các mốc cao để kịp chốt
        cMul = 1.0 + Math.pow(tm, 1.5) * (cPoint > 10 ? 0.05 : 0.2); 
        
        let b=10+(cMul*8)%100, l=10+(cMul*15)%250;
        rk.style.bottom=b+'px'; rk.style.left=l+'px';
        
        if(cMul>=cPoint){
            clearInterval(crTimer); crTimer=null; cCrashed=true;
            m.innerText=cMul.toFixed(2)+"x (NỔ)"; m.style.color='#ff4757'; rk.innerText="💥";
            document.getElementById('btnCashCrash').disabled=true; document.getElementById('btnStartCrash').style.display='block'; document.getElementById('betCrash').disabled=false; capNhat();
        }else{
            m.innerText=cMul.toFixed(2)+"x"; document.getElementById('btnCashCrash').innerText=`CHỐT (${cMul.toFixed(2)}x)`;
        }
    },30);
}

function cashCrash(){if(!crTimer||cCrashed)return;clearInterval(crTimer);crTimer=null;let win=0;if(cMul<1.1){win=3000;soDu+=win;alert(`Chốt 1x: Nhận 3.000đ!`)}else if(cMul<2.0){alert(`Chốt sớm (<2.0x). Mất tiền!`)}else{win=Math.floor(cBet*cMul);soDu+=win;alert(`Chốt thành công! Nhận: ${fmt(win)}`);if(win>=10000000)showToast(`🔥 ${ten} chốt Tên Lửa ${cMul.toFixed(2)}x +${fmt(win)}!`)}document.getElementById('rocketObj').innerText="🚀";document.getElementById('btnCashCrash').disabled=true;document.getElementById('btnStartCrash').style.display='block';document.getElementById('betCrash').disabled=false;capNhat()}

// === CÁO THỎ (LÊN ĐẾN 40X) ===
function startRab(){
    if(raTimer)return;rBet=parseInt(document.getElementById('betRab').value);if(isNaN(rBet)||rBet<1000||rBet>soDu)return alert("Tiền cược không hợp lệ!");
    soDu-=rBet;capNhat();rMul=1;rCaught=false;
    
    let r=Math.random();
    if(r<0.6) rPoint=Math.random()*3+2.0; // 60% từ 2-5x
    else if(r<0.9) rPoint=Math.random()*10+5.0; // 30% từ 5-15x
    else rPoint=Math.random()*25+15.0; // 10% từ 15-40x

    let rab=document.getElementById('rabObj'),fox=document.getElementById('foxObj'),rDiv=document.getElementById('multRab');
    rab.innerText="🐇";fox.innerText="🦊";rDiv.innerText="1.00x";rDiv.style.color='#fff';
    document.getElementById('btnStartRab').style.display='none';document.getElementById('btnCashRab').disabled=false;document.getElementById('betRab').disabled=true;
    
    let st=Date.now();
    raTimer=setInterval(()=>{
        let tm=(Date.now()-st)/1000;
        rMul=1+(tm*1.0);
        let prog=(rMul-1)/(rPoint-1);if(prog>1)prog=1;
        let rPos=(70+(prog*40))%110,fPos=(30+(prog*80))%110;
        rab.style.left=rPos+'%';fox.style.left=fPos+'%';
        
        if(rMul>=rPoint){
            clearInterval(raTimer);raTimer=null;rCaught=true;
            fox.style.left=(rPos-2)+'%';rab.innerText="💥";rDiv.innerText=rPoint.toFixed(2)+"x (BỊ BẮT)";rDiv.style.color='#ff4757';
            document.getElementById('btnCashRab').disabled=true;document.getElementById('btnStartRab').style.display='block';document.getElementById('betRab').disabled=false;capNhat();
        }else{
            rDiv.innerText=rMul.toFixed(2)+"x";document.getElementById('btnCashRab').innerText=`CHỐT (${rMul.toFixed(2)}x)`;
        }
    },30);
}

function cashRab(){if(!raTimer||rCaught)return;clearInterval(raTimer);raTimer=null;let rab=document.getElementById('rabObj'),fox=document.getElementById('foxObj'),win=0;if(rMul<1.1){win=3000;soDu+=win;rab.innerText="🏆";fox.innerText="😡";alert(`Chốt 1x: Nhận 3.000đ!`)}else if(rMul<2.0){rab.innerText="💥";fox.innerText="🦊";alert(`Chốt sớm (<2.0x). Mất tiền!`)}else{win=Math.floor(rBet*rMul);soDu+=win;rab.innerText="🏆";fox.innerText="😡";alert(`Chốt thành công! Nhận: ${fmt(win)}`);if(win>=10000000)showToast(`🔥 ${ten} chốt Thỏ ${rMul.toFixed(2)}x +${fmt(win)}!`)}document.getElementById('btnCashRab').disabled=true;document.getElementById('btnStartRab').style.display='block';document.getElementById('betRab').disabled=false;capNhat()}

// === BẮT GÔN (GIỚI HẠN 3 LẦN) ===
function sutGon(huong){
    if(goalCount >= 3) return alert("Bạn đã hết lượt sút (Tối đa 3 lần)!");
    
    let cuoc=parseInt(document.getElementById('betGoal').value);
    if(isNaN(cuoc)||cuoc<1000||cuoc>soDu)return alert("Tiền cược không hợp lệ!");
    
    goalCount++;
    soDu-=cuoc;capNhat();
    let gk=document.getElementById('gkObj'),res=document.getElementById('resGoal');
    res.innerText="Thủ môn đang bay...";res.style.color='#fff';
    
    let doanBat = ['TL','TR','DL','DR'][Math.floor(Math.random()*4)];
    gk.style.top='50%';gk.style.left='50%';
    
    setTimeout(()=>{
        if(doanBat==='TL'){gk.style.top='20%';gk.style.left='20%'}
        else if(doanBat==='TR'){gk.style.top='20%';gk.style.left='80%'}
        else if(doanBat==='DL'){gk.style.top='80%';gk.style.left='20%'}
        else{gk.style.top='80%';gk.style.left='80%'}
    },100);
    
    setTimeout(()=>{
        if(doanBat===huong){
            res.innerText="BỊ BẮT! Mất tiền cược.";res.style.color='#ff4757';gk.innerText="🧤";
        }else{
            let win=cuoc*2;soDu+=win;res.innerText="VÀO GÔN! Thắng "+fmt(win);res.style.color='#00ff88';gk.innerText="❌";
            if(win>=10000000)showToast(`🔥 ${ten} sút Penalty thắng +${fmt(win)}!`);
        }
        capNhat();
        if(goalCount >= 3) {
            setTimeout(() => alert("Bạn đã hết lượt chơi Bắt Gôn (Tối đa 3 lần)!"), 500);
        }
        setTimeout(()=>{gk.innerText="🧤";gk.style.top='50%';gk.style.left='50%'},2000);
    },600);
}

function vayTien(){if(soNo+2000000>10000000)return alert("Vượt hạn mức vay 10M!");show('loanModal')}
function xacNhanVay(){soNo+=2000000;soDu+=2000000;dongModal();capNhat()}
function dongModal(){hide('loanModal')}

function moAdmin(){
    let tbody=document.querySelector('#adminTable tbody');tbody.innerHTML='';
    for(let t in data){
        let u=data[t];
        let banBtn=(t==='liam')?`<span style="color:#888;font-size:12px">Bạn</span>`:(u.isBanned?`<button onclick="unban('${t}')" style="background:orange;padding:2px">Mở</button>`:`<button onclick="ban('${t}')" style="background:red;padding:2px">Ban</button>`);
        tbody.innerHTML+=`<tr style="${u.isBanned?'opacity:0.5':''}"><td>${t}</td><td>${fmt(u.soDu)}</td><td><input type="number" id="in_${t}" class="adm-inp"><button onclick="sua('${t}')" style="background:green;padding:2px">Sửa</button></td><td>${banBtn}</td></tr>`
    }
    show('adminModal')
}
function dongAdmin(){hide('adminModal')}
function sua(t){let val=parseInt(document.getElementById(`in_${t}`).value);if(isNaN(val))return alert("Nhập số tiền!");data[t].soDu+=val;if(t===ten){soDu=data[t].soDu;capNhat()}moAdmin()}
function ban(t){if(t==='liam')return alert("Không thể ban chính mình!");if(confirm("Ban tài khoản này?")){data[t].isBanned=true;saveData();moAdmin()}}
function unban(t){data[t].isBanned=false;saveData();moAdmin()}
</script>
</body>
</html>
