<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBLIC IN CLUB</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');
    * { box-sizing: border-box; font-family: 'Roboto', sans-serif; margin: 0; padding: 0; }
    body { background: #050505; color: #e0e0e0; display: flex; justify-content: center; min-height: 100vh; }
    .app { width: 100%; max-width: 480px; background: #111; padding: 15px; }
    #authScreen { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
    .auth-box { background: #111; padding: 30px; border-radius: 15px; border: 1px solid #d4af37; width: 90%; max-width: 350px; text-align: center; }
    .auth-box h2 { color: #d4af37; margin-bottom: 20px; }
    .auth-box input { width: 100%; padding: 12px; margin: 10px 0; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 5px; }
    .auth-btn { width: 100%; padding: 12px; margin-top: 10px; background: #d4af37; color: black; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .switch-auth { margin-top: 15px; font-size: 13px; color: #888; cursor: pointer; }
    .header { display: flex; justify-content: space-between; align-items: start; padding-bottom: 15px; border-bottom: 1px solid #333; margin-bottom: 15px; }
    .brand { color: #d4af37; font-size: 20px; font-weight: bold; }
    .balance { font-size: 22px; color: #00ff88; font-weight: bold; text-align: right; }
    .toolbar { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn-tool { flex: 1; padding: 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; }
    .btn-nap { background: #9b59b6; } .btn-admin { background: #d4af37; color: black; }
    .tabs { display: flex; gap: 5px; margin-bottom: 15px; background: #1a1a1a; padding: 5px; border-radius: 10px; }
    .tab { flex: 1; padding: 10px; text-align: center; font-size: 13px; color: #888; cursor: pointer; border-radius: 8px; font-weight: bold; }
    .tab.active { background: #333; color: #d4af37; }
    .bets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 15px; }
    .bet-btn { padding: 8px; background: #222; border: 1px solid #444; color: #aaa; border-radius: 5px; cursor: pointer; font-size: 12px; }
    .bet-btn.active { background: rgba(212,175,55,0.2); border-color: #d4af37; color: #d4af37; }
    .game { display: none; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    .game.active { display: block; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-act { padding: 20px; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; }
    .bg-tai { background: #e74c3c; } .bg-xiu { background: #3498db; } .bg-xu { background: #9b59b6; }
    .admin-panel { display: none; background: #111; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #d4af37; }
    .user-table { width: 100%; font-size: 12px; border-collapse: collapse; } .user-table th, .user-table td { padding: 8px; border-bottom: 1px solid #333; text-align: left; }
    .btn-small { padding: 4px 8px; border-radius: 3px; border: none; cursor: pointer; font-size: 10px; font-weight: bold; margin-bottom: 2px; }
    .btn-add { background: #00ff88; color: black; } .btn-ban { background: #ff3333; color: white; } .btn-unban { background: #f39c12; color: black; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background: #111; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #d4af37; }
    .inp { margin-bottom: 15px; } .inp label { display: block; margin-bottom: 5px; font-size: 13px; color: #ccc; }
    .inp input, .inp select { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #444; color: white; border-radius: 5px; }
    .modal-btns { display: flex; gap: 10px; margin-top: 15px; }
    .btn-submit { flex: 1; background: #d4af37; color: black; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; }
    .btn-close { flex: 1; background: #333; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; }
    #bannedScreen { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10000; color: #ff3333; }
    .debt-info { font-size: 14px; color: #ff3333; font-weight: bold; display: none; }
</style>
</head>
<body>

<div id="authScreen">
    <div class="auth-box" id="loginBox">
        <h2>PUBLIC IN CLUB</h2>
        <input type="text" id="loginUser" placeholder="Tên đăng nhập">
        <input type="password" id="loginPass" placeholder="Mật khẩu">
        <button class="auth-btn" onclick="login()">Đăng Nhập</button>
        <div class="switch-auth" onclick="toggleAuth('register')">Chưa có tài khoản? Đăng ký ngay</div>
    </div>
    <div class="auth-box" id="registerBox" style="display:none;">
        <h2>ĐĂNG KÝ VIP</h2>
        <input type="text" id="regUser" placeholder="Tên đăng nhập">
        <input type="password" id="regPass" placeholder="Mật khẩu">
        <input type="password" id="regPassConfirm" placeholder="Nhập lại mật khẩu">
        <button class="auth-btn" onclick="register()">Tạo Tài Khoản</button>
        <div class="switch-auth" onclick="toggleAuth('login')">Đã có tài khoản? Đăng nhập</div>
    </div>
</div>

<div id="bannedScreen"><h2>🚫 TÀI KHOẢN ĐÃ BỊ KHÓA</h2></div>

<div class="app" id="mainApp" style="display:none;">
    <div class="header">
        <div>
            <div class="brand">PUBLIC IN CLUB</div>
            <div style="font-size:13px;"><span id="displayUser"></span> <span id="displayRole" style="display:none; background:#333; color:#d4af37; padding:2px 5px; border-radius:3px; font-size:10px;">ADMIN</span></div>
            <div class="debt-info" id="debtDisplay">NỢ: 0 đ</div>
        </div>
        <div>
            <div class="balance" id="displayBalance">0 đ</div>
            <button style="margin-top:5px;padding:8px 12px;border:none;border-radius:5px;font-weight:bold;cursor:pointer;background:#f39c12;color:black;font-size:12px;width:100%;" id="btnDebt" onclick="handleDebt()">VAY VỐN</button>
        </div>
    </div>

    <div class="toolbar">
        <button class="btn-tool btn-nap" onclick="openModal('napTheModal')">💳 Nạp Thẻ</button>
        <button class="btn-tool btn-admin" id="btnAdminPanel" onclick="toggleAdminPanel()" style="display:none;">👑 Quản Trị</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <div style="color:#d4af37; font-weight:bold; margin-bottom:10px;">Danh Sách Người Chơi</div>
        <table class="user-table"><thead><tr><th>Tên</th><th>Tiền</th><th>Nợ</th><th>Hành Động</th></tr></thead><tbody id="adminUserList"></tbody></table>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('taixiu', this)">Tài Xỉu</div>
        <div class="tab" onclick="switchTab('tenlua', this)">Tên Lửa</div>
        <div class="tab" onclick="switchTab('da', this)">Đá (Click)</div>
        <div class="tab" onclick="switchTab('xu', this)">Lật Xu</div>
    </div>

    <div class="bets">
        <button class="bet-btn active" onclick="setBet(20000, this)">20K</button>
        <button class="bet-btn" onclick="setBet(100000, this)">100K</button>
        <button class="bet-btn" onclick="setBet(500000, this)">500K</button>
        <button class="bet-btn" onclick="setBet(1000000, this)">1M</button>
        <button class="bet-btn" onclick="setBet(10000000, this)">10M</button>
        <button class="bet-btn" onclick="setBet(100000000, this)">100M</button>
        <button class="bet-btn" onclick="setBet(500000000, this)">500M</button>
        <button class="bet-btn" onclick="setBet(1000000000, this)">1B</button>
    </div>

    <div id="game-taixiu" class="game active">
        <div class="actions">
            <button class="btn-act bg-tai" onclick="playTaiXiu('tai')">TÀI</button>
            <button class="btn-act bg-xiu" onclick="playTaiXiu('xiu')">XỈU</button>
        </div>
        <div style="text-align:center; margin-top:10px; font-size:12px;" id="taixiuResult"></div>
    </div>

    <div id="game-tenlua" class="game">
        <div style="font-size:48px; color:#00ff88; text-align:center; margin:20px 0;" id="rocketValue">x1.00</div>
        <div style="text-align:center; color:#888; font-size:12px;" id="rocketStatus">Sẵn sàng...</div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-act" style="background:#00ff88; color:black; flex:1;" onclick="startRocket()">BẮT ĐẦU</button>
            <button class="btn-act" style="background:#d4af37; color:black; flex:1;" onclick="cashOutRocket()">RÚT</button>
        </div>
    </div>

    <div id="game-da" class="game">
        <div style="text-align:center; padding:30px; background:#222; border:2px dashed #f39c12; border-radius:15px; cursor:pointer; user-select:none;" id="daClickArea" onmousedown="startDaClick()" onmouseup="stopDaClick()" onmouseleave="stopDaClick()" ontouchstart="startDaClick()" ontouchend="stopDaClick()">
            <div style="font-size:48px; font-weight:bold; color:#f39c12;" id="daMultiplier">x1.00</div>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
            <button class="btn-act" style="background:#00ff88; color:black; flex:1;" onclick="startDaGame()">BẮT ĐẦU</button>
            <button class="btn-act" style="background:#d4af37; color:black; flex:1;" onclick="cashOutDa()">RÚT</button>
        </div>
        <div style="text-align:center; margin-top:10px; font-size:12px;" id="daResult"></div>
    </div>

    <div id="game-xu" class="game">
        <div class="actions">
            <button class="btn-act bg-xu" onclick="playXu('ngua')">NGỬA</button>
            <button class="btn-act bg-xu" onclick="playXu('up')">ÚP</button>
        </div>
        <div style="text-align:center; margin-top:10px; font-size:12px;" id="xuResult"></div>
    </div>
</div>

<!-- Modals -->
<div class="modal" id="napTheModal"><div class="modal-content"><h3>NẠP THẺ</h3><select id="napTheValue" style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><option value="10000">10K</option><option value="20000">20K</option><option value="50000">50K</option><option value="100000">100K</option><option value="200000">200K</option><option value="500000">500K</option></select><input type="text" id="napTheCode" placeholder="Mã 8 số" maxlength="8" style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><input type="text" id="napTheSeri" placeholder="Seri >10 số" minlength="11" style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><div class="modal-btns"><button class="btn-submit" onclick="submitThe()">Gửi</button><button class="btn-close" onclick="closeModal('napTheModal')">Hủy</button></div></div></div>

<div class="modal" id="vayModal"><div class="modal-content"><h3>VAY VỐN</h3><input type="number" id="vayAmount" placeholder="Số tiền" style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><div class="modal-btns"><button class="btn-submit" onclick="submitVay()">Gửi</button><button class="btn-close" onclick="closeModal('vayModal')">Hủy</button></div></div></div>

<div class="modal" id="adminMoneyModal"><div class="modal-content"><h3>ADMIN CỘNG TIỀN</h3><input type="text" id="adminUserTarget" readonly style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><input type="number" id="adminMoneyAmount" placeholder="Số tiền" style="width:100%;padding:10px;margin-bottom:10px;background:#1a1a1a;border:1px solid #444;color:white;"><div class="modal-btns"><button class="btn-submit" onclick="adminAddMoney()">Cộng</button><button class="btn-close" onclick="closeModal('adminMoneyModal')">Hủy</button></div></div></div>

<script>
    // --- DATA LOCALSTORAGE ---
    var users = JSON.parse(localStorage.getItem('clubUsers')) || { 'liam': { pass: '231213', money: 2000200000, debt: 0, isAdmin: true, isBanned: false } };
    var currentUser = null, currentBet = 20000;
    var rInt, rVal = 1, rRun = false;
    var dInt, dVal = 1, dRun = false;

    function save() { localStorage.setItem('clubUsers', JSON.stringify(users)); }
    function toggleAuth(t) { document.getElementById('loginBox').style.display = t==='login'?'block':'none'; document.getElementById('registerBox').style.display = t==='register'?'block':'none'; }
    function openModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- AUTH ---
    function login() {
        var u = document.getElementById('loginUser').value.trim(), p = document.getElementById('loginPass').value;
        if (users[u] && users[u].pass === p) {
            if (users[u].isBanned) { document.getElementById('bannedScreen').style.display = 'flex'; return; }
            currentUser = u; document.getElementById('authScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; updateUI();
        } else alert("Sai tên hoặc mật khẩu!");
    }

    function register() {
        var u = document.getElementById('regUser').value.trim(), p = document.getElementById('regPass').value, p2 = document.getElementById('regPassConfirm').value;
        if (!u || !p) return alert("Nhập đủ thông tin!");
        if (p !== p2) return alert("Mật khẩu không khớp!");
        if (users[u]) return alert("Tên đã tồn tại!");
        users[u] = { pass: p, money: 500000, debt: 0, isAdmin: false, isBanned: false };
        save(); alert("Đăng ký thành công! Nhận 500k.");
        currentUser = u; document.getElementById('authScreen').style.display = 'none'; document.getElementById('mainApp').style.display = 'block'; updateUI();
    }

    // --- UI UPDATE ---
    function updateUI() {
        if (!currentUser) return;
        var u = users[currentUser];
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('displayBalance').innerText = u.money.toLocaleString() + " đ";
        var debtEl = document.getElementById('debtDisplay'), btnDebt = document.getElementById('btnDebt');
        if (u.debt > 0) { debtEl.style.display = 'block'; debtEl.innerText = "NỢ: " + u.debt.toLocaleString() + " đ"; btnDebt.innerText = "TRẢ NỢ"; btnDebt.style.background = "#e74c3c"; }
        else { debtEl.style.display = 'none'; btnDebt.innerText = "VAY VỐN"; btnDebt.style.background = "#f39c12"; }
        if (u.isAdmin) { document.getElementById('displayRole').style.display = 'inline-block'; document.getElementById('btnAdminPanel').style.display = 'block'; renderAdmin(); }
        else { document.getElementById('displayRole').style.display = 'none'; document.getElementById('btnAdminPanel').style.display = 'none'; document.getElementById('adminPanel').style.display = 'none'; }
    }

    function switchTab(t, e) { document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');}); document.querySelectorAll('.game').forEach(function(x){x.classList.remove('active');}); e.classList.add('active'); document.getElementById('game-'+t).classList.add('active'); }
    function setBet(a, e) { currentBet = a; document.querySelectorAll('.bet-btn').forEach(function(x){x.classList.remove('active');}); e.classList.add('active'); }

    // --- GAMES (ĐÃ LÀM KHÓ) ---
    function playTaiXiu(c) {
        var u = users[currentUser]; if (u.money < currentBet) return alert("Không đủ tiền!");
        u.money -= currentBet;
        var res = Math.random() < 0.35 ? c : (c === 'tai' ? 'xiu' : 'tai'); // 35% thắng
        if (c === res) { u.money += currentBet*2; document.getElementById('taixiuResult').innerText = "THẮNG!"; } else { document.getElementById('taixiuResult').innerText = "THUA!"; }
        save(); updateUI();
    }

    function playXu(c) {
        var u = users[currentUser]; if (u.money < currentBet) return alert("Không đủ tiền!");
        u.money -= currentBet;
        var res = Math.random() < 0.4 ? c : (c === 'ngua' ? 'up' : 'ngua'); // 40% thắng
        if (c === res) { u.money += currentBet*2; document.getElementById('xuResult').innerText = "THẮNG!"; } else { document.getElementById('xuResult').innerText = "THUA!"; }
        save(); updateUI();
    }

    function startRocket() {
        var u = users[currentUser]; if (u.money < currentBet) return alert("Không đủ tiền!"); if (rRun) return;
        u.money -= currentBet; updateUI(); save();
        rRun = true; rVal = 1; document.getElementById('rocketValue').innerText = "x1.00"; document.getElementById('rocketStatus').innerText = "Đang bay...";
        rInt = setInterval(function() {
            rVal += 0.05; document.getElementById('rocketValue').innerText = "x" + rVal.toFixed(2);
            if (rVal >= 3.0 && Math.random() < 0.02) { clearInterval(rInt); rRun = false; document.getElementById('rocketStatus').innerText = "💥 NỔ!"; return; }
            if (rVal >= 30) { clearInterval(rInt); rRun = false; document.getElementById('rocketStatus').innerText = "Đạt x30!"; }
        }, 100);
    }

    function cashOutRocket() {
        if (!rRun) return; if (rVal < 3.0) return alert("Phải đạt x3!");
        clearInterval(rInt); rRun = false;
        var w = Math.floor(currentBet * rVal); users[currentUser].money += w; save(); updateUI();
        document.getElementById('rocketStatus').innerText = 'Rút '+w.toLocaleString()+'đ!';
    }

    function startDaGame() {
        var u = users[currentUser]; if (u.money < currentBet) return alert("Không đủ tiền!"); if (dRun) return;
        u.money -= currentBet; updateUI(); save();
        dRun = true; dVal = 1; document.getElementById('daMultiplier').innerText = "x1.00"; document.getElementById('daResult').innerHTML = "";
    }
    function startDaClick() {
        if (!dRun || dInt) return;
        dInt = setInterval(function() {
            dVal += 0.05; document.getElementById('daMultiplier').innerText = "x" + dVal.toFixed(2);
            if (dVal >= 3.0 && Math.random() < 0.02) { clearInterval(dInt); dInt = null; dRun = false; document.getElementById('daResult').innerHTML = '<span style="color:#ff3333">💥 NỔ!</span>'; }
            if (dVal >= 30) { clearInterval(dInt); dInt = null; dRun = false; document.getElementById('daResult').innerHTML = '<span style="color:#d4af37">ĐẠT x30!</span>'; }
        }, 50);
    }
    function stopDaClick() { if (dInt) { clearInterval(dInt); dInt = null; } }
    function cashOutDa() {
        if (!dRun) return; if (dVal < 3.0) return alert("Phải đạt x3!");
        stopDaClick(); dRun = false;
        var w = Math.floor(currentBet * dVal); users[currentUser].money += w; save(); updateUI();
        document.getElementById('daResult').innerHTML = '<span style="color:#00ff88">RÚT '+w.toLocaleString()+'đ!</span>';
    }

    // --- VAY / TRẢ NỢ ---
    function handleDebt() {
        var u = users[currentUser];
        if (u.debt > 0) {
            if (confirm("Trả nợ " + u.debt.toLocaleString() + "đ?")) {
                if (u.money >= u.debt) { u.money -= u.debt; u.debt = 0; save(); updateUI(); alert("Đã trả nợ!"); }
                else alert("Không đủ tiền trả!");
            }
        } else openModal('vayModal');
    }
    function submitVay() {
        var a = parseInt(document.getElementById('vayAmount').value);
        if (!a || a <= 0) return alert("Nhập số tiền!");
        users[currentUser].money += a; users[currentUser].debt += a;
        save(); updateUI(); alert("Đã vay " + a.toLocaleString() + "đ!"); closeModal('vayModal');
    }

    // --- NẠP THẺ ---
    function submitThe() {
        var v = parseInt(document.getElementById('napTheValue').value);
        var c = document.getElementById('napTheCode').value;
        var s = document.getElementById('napTheSeri').value;
        if (c.length !== 8 || s.length <= 10) return alert("Sai định dạng!");
        users[currentUser].money += v; save(); updateUI();
        alert("Nạp thành công " + v.toLocaleString() + "đ!"); closeModal('napTheModal');
    }

    // --- ADMIN ---
    function toggleAdminPanel() { var p = document.getElementById('adminPanel'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; renderAdmin(); }
    function renderAdmin() {
        var h = '';
        for (var u in users) {
            var user = users[u];
            h += '<tr><td>'+u+(user.isBanned?' (BAN)':'')+'</td><td>'+(user.money||0).toLocaleString()+'</td><td style="color:#ff3333">'+(user.debt||0).toLocaleString()+'</td><td><button class="btn-small btn-add" onclick="quickAdd(\''+u+'\')">+$</button> <button class="btn-small '+(user.isBanned?'btn-unban':'btn-ban')+'" onclick="'+(user.isBanned?'unbanUser':'quickBan')+'(\''+u+'\')">'+(user.isBanned?'Gỡ':'Ban')+'</button></td></tr>';
        }
        document.getElementById('adminUserList').innerHTML = h;
    }
    function quickAdd(u) { document.getElementById('adminUserTarget').value = u; openModal('adminMoneyModal'); }
    function quickBan(u) { if (confirm('Ban '+u+'?')) { users[u].isBanned = true; save(); updateUI(); } }
    function unbanUser(u) { if (confirm('Gỡ ban '+u+'?')) { users[u].isBanned = false; save(); updateUI(); } }
    function adminAddMoney() {
        var t = document.getElementById('adminUserTarget').value;
        var a = parseInt(document.getElementById('adminMoneyAmount').value);
        if (users[t]) { users[t].money += a; save(); updateUI(); alert("Đã cộng "+a.toLocaleString()+"đ cho "+t); closeModal('adminMoneyModal'); }
    }
</script>
</body>
</html>
